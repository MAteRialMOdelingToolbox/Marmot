# This is a workflow to build the repo on Windows (x64, MSVC), Release only.
name: build_windows

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    # cmd.exe, because only its activation runs the environment's MSVC setup (vs2022_compiler_vars.bat); conda installs
    # the dependencies' headers under %CONDA_PREFIX%\Library.
    defaults:
      run:
        shell: cmd /C CALL {0}
    steps:
      - name: Check out Marmot
        uses: actions/checkout@v7

      # The compilers, CMake, Eigen, autodiff and Fastor of the stack: see .github/actions/setup-stack.
      - uses: ./.github/actions/setup-stack
        with:
          init-shell: cmd.exe bash

      - name: Build Marmot
        run: |
          cmake --version
          rem Fail on compiler warnings (/WX); local builds keep warnings non-fatal.
          cmake -S . -B build -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DCMAKE_PREFIX_PATH="%CONDA_PREFIX%\Library" -DCMAKE_FIND_USE_PACKAGE_REGISTRY=OFF -DCMAKE_INSTALL_PREFIX="%GITHUB_WORKSPACE%\marmot-install" || exit /b 1
          cmake --build build --config Release --parallel || exit /b 1

      - name: Run tests
        run: |
          rem --no-tests=error: ctest exits 0 on an empty test set, which would
          rem report success for a build that produced no tests at all.
          ctest --test-dir build -C Release --output-on-failure --no-tests=error || exit /b 1

      - name: Install Marmot
        run: |
          cmake --install build --config Release || exit /b 1

      - name: Upload Marmot
        uses: actions/upload-artifact@v7
        with:
          name: Marmot-windows-x64-Release
          path: marmot-install
