# This is a workflow to build the repo on Windows (x64, MSVC), Release only.
name: build_windows

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    env:
      # All dependencies are header-only; they are installed into this prefix, and Marmot is found through it.
      DEPS_PREFIX: ${{ github.workspace }}/deps
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Show toolchain
        run: |
          cmake --version

      # The dependencies are pinned to tags, so their install prefix is cached, keyed on those tags.
      - name: Cache dependencies
        id: deps-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.DEPS_PREFIX }}
          key: deps-windows-2022-eigen-5.0.1-autodiff-v1.1.2-397-fastor-V0.6.4

      # Build directories are named _build: autodiff ships a BUILD file, and Windows paths are case-insensitive.
      - name: Install Eigen
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 5.0.1 https://gitlab.com/libeigen/eigen.git
          cmake -S eigen -B eigen/_build -DBUILD_TESTING=OFF -DEIGEN_BUILD_BLAS=OFF -DEIGEN_BUILD_LAPACK=OFF -DCMAKE_INSTALL_PREFIX="$env:DEPS_PREFIX"
          cmake --install eigen/_build

      # autodiff 1.1.2 does not compile against Eigen 5; autodiff#397 (one header, not merged upstream yet) is applied
      # from its pinned commit.
      - name: Install Autodiff
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v1.1.2 https://github.com/autodiff/autodiff.git
          curl -sfL -o autodiff-eigen5.diff https://github.com/autodiff/autodiff/commit/a4401bdd338784952f6084b69960cf914ba4e6af.diff
          git -C autodiff apply ../autodiff-eigen5.diff
          cmake -S autodiff -B autodiff/_build -DCMAKE_INSTALL_PREFIX="$env:DEPS_PREFIX" `
            -DAUTODIFF_BUILD_TESTS=OFF -DAUTODIFF_BUILD_PYTHON=OFF -DAUTODIFF_BUILD_EXAMPLES=OFF -DAUTODIFF_BUILD_DOCS=OFF
          cmake --install autodiff/_build

      - name: Install Fastor
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch V0.6.4 https://github.com/romeric/Fastor.git
          cmake -S Fastor -B Fastor/_build -DBUILD_TESTING=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_INSTALL_PREFIX="$env:DEPS_PREFIX"
          cmake --install Fastor/_build

      - name: Check out Marmot
        uses: actions/checkout@v7
        with:
          path: Marmot

      - name: Build Marmot
        run: |
          # Fail on compiler warnings (/WX); local builds keep warnings non-fatal.
          cmake -S Marmot -B Marmot/_build -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DCMAKE_PREFIX_PATH="$env:DEPS_PREFIX" `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/marmot-install"
          cmake --build Marmot/_build --config Release --parallel

      - name: Run tests
        working-directory: Marmot/_build
        run: |
          # --no-tests=error: ctest exits 0 on an empty test set, which would
          # report success for a build that produced no tests at all.
          ctest -C Release --output-on-failure --no-tests=error

      - name: Install Marmot
        run: |
          cmake --install Marmot/_build --config Release

      - name: Upload Marmot
        uses: actions/upload-artifact@v7
        with:
          name: Marmot-windows-x64-Release
          path: marmot-install
