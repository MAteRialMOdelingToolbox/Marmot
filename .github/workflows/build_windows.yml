# This is a workflow to build the repo on Windows (x64, MSVC), Release only.
name: build_windows

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    # cmd.exe, because only its activation runs the environment's MSVC setup (vs2022_compiler_vars.bat); conda installs
    # the dependencies' headers under %CONDA_PREFIX%\Library.
    defaults:
      run:
        shell: cmd /C CALL {0}
    steps:
      - name: Check out Marmot
        uses: actions/checkout@v7

      # The compilers, CMake, Eigen and Fastor of the stack: see .github/actions/setup-stack.
      - uses: ./.github/actions/setup-stack
        with:
          init-shell: cmd.exe bash

      # Ninja instead of the Visual Studio generator, which ignores compiler launchers. The MSVC environment
      # (cl on PATH) comes from the environment's activation (vs2022_win-64 runs vcvars64 in every step).
      - uses: seanmiddleditch/gha-setup-ninja@v6

      - uses: ./.github/actions/compiler-cache
        with:
          key: windows

      - name: Build Marmot
        run: |
          cmake --version
          rem The activation also presets the Visual Studio generator, its platform and toolset, which Ninja rejects.
          set "CMAKE_GENERATOR="
          set "CMAKE_GENERATOR_PLATFORM="
          set "CMAKE_GENERATOR_TOOLSET="
          rem Fail on compiler warnings (/WX); local builds keep warnings non-fatal.
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DCMAKE_PREFIX_PATH="%CONDA_PREFIX%\Library" -DCMAKE_FIND_USE_PACKAGE_REGISTRY=OFF -DCMAKE_INSTALL_PREFIX="%GITHUB_WORKSPACE%\marmot-install" || exit /b 1
          cmake --build build --parallel || exit /b 1

      - name: Run tests
        run: |
          rem --no-tests=error: ctest exits 0 on an empty test set, which would
          rem report success for a build that produced no tests at all.
          ctest --test-dir build -C Release --output-on-failure --no-tests=error || exit /b 1

      - name: Install Marmot
        run: |
          cmake --install build --config Release || exit /b 1

      - name: Upload Marmot
        uses: actions/upload-artifact@v7
        with:
          name: Marmot-windows-x64-Release
          path: marmot-install
