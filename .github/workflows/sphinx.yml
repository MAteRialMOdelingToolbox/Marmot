name: Documentation

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Mambaforge
        uses: conda-incubator/setup-miniconda@v4
        with:
          use-mamba: true
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: anaconda-client-env

      # The documentation tools, and Eigen, autodiff and Fastor from the channel of the stack, whose recipes carry the
      # patches of the dependencies (see .github/actions/setup-stack); listed first, so that its packages win.
      - name: Install conda packages
        shell: bash -l {0}
        run: |
          mamba install -c https://repo.prefix.dev/matthiasneuner/edelweiss -c conda-forge --file doc/requirements.txt
          mamba list "^(eigen|autodiff|fastor)$" --show-channel-urls

      - name: Building Marmot documentation
        shell: bash -l {0}
        run: |
          python scripts/buildDocumentation.py --werror

      - name: Upload documentation artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: ./doc/doc_out/sphinx
          retention-days: 7

      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./doc/doc_out/sphinx
          publish_branch: gh-pages


