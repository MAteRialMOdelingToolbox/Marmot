# This is a workflow to build the repo on ubuntu
name: build_ubuntu

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The default build, with the Python bindings.
          - name: default
            cmake_options: -DMARMOT_BUILD_PYTHON_BINDINGS=ON
          # Exports only the MARMOT_API-marked API, as the Windows DLL does; the Python bindings are not supported
          # then. tests/consumer links the shared library and checks that the exported API is complete.
          - name: export-api-only
            cmake_options: -DMARMOT_EXPORT_API_ONLY=ON
          # The optional Sacado backend of the vector-mode AD drivers (found through Trilinos' CMake package);
          # code differentiated by these drivers must build and pass the tests with both backends.
          - name: sacado
            cmake_options: -DMARMOT_AD_VECTOR_BACKEND=Sacado
            sacado: true
    name: build (${{ matrix.name }})
    env:
      CC:   gcc-14
      CXX:  g++-14
    steps:
      - name: Install Python dependencies
        shell: bash -leo pipefail {0}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-dev python3-numpy

      - name: Install Eigen
        shell: bash -leo pipefail {0}
        run: |
          git clone --branch 5.0.1 https://gitlab.com/libeigen/eigen.git
          cd eigen
          mkdir build
          cd build
          cmake -DBUILD_TESTING=OFF -DEIGEN_BUILD_BLAS=OFF -DEIGEN_BUILD_LAPACK=OFF ..
          sudo make install
          cd ../..

      # autodiff 1.1.2 does not compile against Eigen 5; autodiff#397 (one header, not merged upstream yet) is applied
      # from its pinned commit.
      - name: Install Autodiff
        shell: bash -leo pipefail {0}
        run: |
          git clone --branch v1.1.2 https://github.com/autodiff/autodiff.git
          curl -sfL -o autodiff-eigen5.diff https://github.com/autodiff/autodiff/commit/a4401bdd338784952f6084b69960cf914ba4e6af.diff
          git -C autodiff apply ../autodiff-eigen5.diff
          cd autodiff
          mkdir build
          cd build
          cmake -DAUTODIFF_BUILD_TESTS=OFF -DAUTODIFF_BUILD_PYTHON=OFF -DAUTODIFF_BUILD_EXAMPLES=OFF -DAUTODIFF_BUILD_DOCS=OFF ..
          sudo make install
          cd ../..

      - name: Install Fastor
        shell: bash -leo pipefail {0}
        run: |
          git clone --branch V0.6.4 https://github.com/romeric/Fastor.git
          cd Fastor
          mkdir build
          cd build
          cmake -DBUILD_TESTING=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5  ..
          sudo make install
          cd ../..

      # Trilinos with Sacado as its only package; Marmot uses only Sacado's headers.
      - name: Install Sacado
        if: ${{ matrix.sacado }}
        shell: bash -leo pipefail {0}
        run: |
          git clone --depth 1 --branch trilinos-release-17-3-0 https://github.com/trilinos/Trilinos.git
          cmake -S Trilinos -B Trilinos/build -DCMAKE_BUILD_TYPE=Release -DTrilinos_ENABLE_Sacado=ON \
            -DTrilinos_ENABLE_ALL_OPTIONAL_PACKAGES=OFF -DTrilinos_ENABLE_TESTS=OFF -DTrilinos_ENABLE_Fortran=OFF \
            -DTPL_ENABLE_MPI=OFF
          cmake --build Trilinos/build --parallel
          sudo cmake --install Trilinos/build

      - name: Check out Marmot
        uses: actions/checkout@v7

      - name: Install Marmot
        shell: bash -leo pipefail {0}
        run: |
          mkdir build
          cd build
          # Fail on compiler warnings (-Werror, /WX); local builds keep warnings non-fatal.
          cmake -DCMAKE_COMPILE_WARNING_AS_ERROR=ON ${{ matrix.cmake_options }} ..
          sudo make install
          # --no-tests=error: ctest exits 0 on an empty test set, which would
          # report success for a build that produced no tests at all.
          ctest --output-on-failure --no-tests=error
