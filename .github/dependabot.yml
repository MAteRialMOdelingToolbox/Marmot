# Keeps the GitHub Actions used by the workflows up to date; the publishing workflow (conda.yml) pins them by commit
# SHA, with the tag in a comment, so that a moved tag cannot change what it runs.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
